[project]
name = "axes-common"
version = "0.1.0"
description = "Shared SQLAlchemy models, DB engine and Lambda helpers for Axes services"
requires-python = ">=3.12"
license = "Apache-2.0"

dependencies = [
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
