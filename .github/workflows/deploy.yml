        uses: docker/build-push-action@v6
        with:
          context: .
          file: billing_service/Dockerfile
          platforms: linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/axes/billing:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=billing-arm64
          cache-to: type=gha,mode=max,scope=billing-arm64

      - name: Resolve image tag
        id: tag
        env:
          REPOSITORY: axes/billing
