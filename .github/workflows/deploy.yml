      - name: Set up QEMU
        if: needs.detect-changes.outputs.slack_app == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: needs.detect-changes.outputs.slack_app == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: needs.detect-changes.outputs.slack_app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: slack_app/Dockerfile
          platforms: linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/axes/slack-app:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=slack-app-arm64
          cache-to: type=gha,mode=max,scope=slack-app-arm64

      - name: Resolve image tag
        id: tag
        env:
          REPOSITORY: axes/slack-app
          BUILD: ${{ needs.detect-changes.outputs.slack_app }}
        run: |
          if [ "$BUILD" = "true" ]; then
