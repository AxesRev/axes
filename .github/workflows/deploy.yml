          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/checkout@v4
        if: needs.detect-changes.outputs.slack_app == 'true'

      - name: Login to Amazon ECR
        id: ecr
        if: needs.detect-changes.outputs.slack_app == 'true'
