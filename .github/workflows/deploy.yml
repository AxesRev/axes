  apply-apps:
    needs: [apply-infra, image-langraph-server, image-neo4j-mcp, image-slack-app, image-billing, image-tenant, image-integrations]
    if: |
      always()
      && !cancelled()
      && (needs.apply-infra.result == 'success' || needs.apply-infra.result == 'skipped')
      && needs.image-langraph-server.result == 'success'
      && needs.image-neo4j-mcp.result == 'success'
      && needs.image-slack-app.result == 'success'
      && needs.image-billing.result == 'success'
      && needs.image-tenant.result == 'success'
      && needs.image-integrations.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::042993547532:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ env.TERRAGRUNT_VERSION }}

      - name: Apply apps
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          LANGRAPH_SERVER_IMAGE_TAG: ${{ needs.image-langraph-server.outputs.tag }}
          NEO4J_MCP_IMAGE_TAG: ${{ needs.image-neo4j-mcp.outputs.tag }}
          SLACK_APP_IMAGE_TAG: ${{ needs.image-slack-app.outputs.tag }}
          BILLING_IMAGE_TAG: ${{ needs.image-billing.outputs.tag }}
          TENANT_IMAGE_TAG: ${{ needs.image-tenant.outputs.tag }}
          INTEGRATIONS_IMAGE_TAG: ${{ needs.image-integrations.outputs.tag }}
        run: >
          terragrunt run --all --non-interactive
          --filter './neo4j-mcp'
          --filter './langraph-server'
          --filter './slack-app'
          --filter './billing'
          --filter './tenant'
          --filter './integrations'
          --filter './webapp-env'
          -- apply
