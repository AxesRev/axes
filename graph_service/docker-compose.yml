# ArcadeDB (Bolt + built-in MCP) — local graph stack for axes / react_agent.
#
# From repository root so Compose can substitute `${ARCADEDB_ROOT_PASSWORD}` from `.env`:
#   docker compose -f graph_service/docker-compose.yml --env-file .env up -d
#
# Studio / HTTP API: http://localhost:${ARCADEDB_PUBLISH_HTTP:-2480}
# MCP (JSON-RPC over HTTP): http://localhost:${ARCADEDB_PUBLISH_HTTP:-2480}/api/v1/mcp
# Bolt from host: bolt://localhost:${ARCADEDB_PUBLISH_BOLT:-7687}
#
# Ingestion creates one database per tenant (tenant_<id>) plus a read-only
# tenant_<id>_reader user whose password is derived from ARCADEDB_TENANT_KEY.

services:
  arcadedb:
    image: arcadedata/arcadedb:26.11.1
    ports:
      - "${ARCADEDB_PUBLISH_HTTP:-2480}:2480"
      - "${ARCADEDB_PUBLISH_BOLT:-7687}:7687"
    environment:
      ARCADEDB_SETTINGS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_ROOT_PASSWORD:-playwithdata}
        -Darcadedb.server.plugins=Bolt:com.arcadedb.bolt.BoltProtocolPlugin
    volumes:
      - arcadedb_databases:/home/arcadedb/databases
    restart: unless-stopped

volumes:
  arcadedb_databases:
